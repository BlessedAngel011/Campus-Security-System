<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><meta name="theme-color" content="#062d63"><link rel="manifest" href="{{ url_for('static_files', filename='manifest.json') }}"><title>Forgot Password | UFH Security</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f4f7fb;color:#17395f;font-family:Arial,Helvetica,sans-serif}.top{background:white;border-bottom:1px solid #e1e7ef;padding:13px 25px}.brand{max-width:900px;margin:auto;display:flex;align-items:center;gap:14px}.brand img{width:76px}.brand strong{display:block;color:#062d63;font-size:17px}.brand span{font-size:11px;color:#78899d}main{min-height:calc(100vh - 120px);display:flex;align-items:center;justify-content:center;padding:35px 15px}.card{width:100%;max-width:520px;background:white;border:1px solid #dfe7f0;border-top:5px solid #0751a8;border-radius:18px;box-shadow:0 14px 34px rgba(20,50,90,.09);padding:28px}.icon{width:55px;height:55px;margin:0 auto 14px;border-radius:15px;background:#e8f1ff;color:#0751a8;display:flex;align-items:center;justify-content:center}.icon svg{width:28px}h1{margin:0;text-align:center;color:#062d63;font-size:23px}.lead{margin:9px auto 22px;text-align:center;color:#73859a;font-size:13px;line-height:1.5}.msg{padding:12px 13px;border-radius:9px;margin-bottom:15px;font-size:12px;line-height:1.45}.error{background:#fff1f2;border:1px solid #f3c5ca;color:#a92832}.success{background:#edf9f1;border:1px solid #bfe5cb;color:#176a38}label{display:block;margin:13px 0 7px;font-size:12px;font-weight:bold}input{width:100%;height:50px;border:1px solid #cdd8e5;border-radius:10px;padding:0 13px;outline:none;color:#163456}input:focus{border-color:#0751a8;box-shadow:0 0 0 3px rgba(7,81,168,.09)}.code{text-align:center;font-size:23px;font-weight:bold;letter-spacing:8px}button{width:100%;height:51px;margin-top:19px;border:0;border-radius:10px;background:#0751a8;color:white;font-weight:bold;cursor:pointer}.links{margin-top:18px;text-align:center;font-size:12px}.links a{color:#0751a8;text-decoration:none;font-weight:bold}@media(max-width:600px){.top{padding:calc(10px + env(safe-area-inset-top)) 14px 10px}.brand img{width:58px}.brand strong{font-size:14px}main{align-items:flex-start;padding-top:25px}.card{padding:22px 16px}h1{font-size:20px}}</style></head><body><header class="top"><div class="brand"><img src="{{ url_for('static_files', filename='ufh-logo.png') }}" alt="UFH"><div><strong>UFH Campus Security</strong><span>Alice Campus</span></div></div></header><main><section class="card"><div class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 7l9 6 9-6"></path></svg></div><h1>Forgot Password</h1><p class="lead">Enter the verified email address linked to your Student account. We will send a 6-digit reset code.</p>{% if error %}<div class="msg error">{{ error }}</div>{% endif %}{% if success %}<div class="msg success">{{ success }}</div>{% endif %}<form method="POST" action="{{ url_for('forgot_password') }}"><label for="email">Email Address</label><input id="email" type="email" name="email" autocomplete="email" placeholder="Enter your email address" required><button type="submit">SEND RESET CODE</button></form><div class="links"><a href="{{ url_for('login') }}">Return to Login</a></div></section></main><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/service-worker.js'));}</script></body></html>
