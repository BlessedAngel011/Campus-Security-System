# CAMPUS SECURITY SYSTEM
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_security_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080
server.address=0.0.0.0
app.admin.token-secret=${ADMIN_TOKEN_SECRET:change-this-before-production}

# SMTP / OTP email. Keep credentials in environment variables, never GitHub.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}

logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
